name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=. .venv/bin/pytest tests -v --tb=short

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build 2>&1 | head -20

      - name: Run frontend tests
        run: npm test -- --run

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: signal-console-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: signal-console-frontend:test
          load: true

  portfolio-validation:
    name: Portfolio Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check portfolio.json exists
        run: |
          test -f portfolio.json && echo "portfolio.json found"
          cat portfolio.json

      - name: Validate portfolio.json schema
        run: |
          python3 -c "
import json, sys
with open('portfolio.json') as f:
    data = json.load(f)
required = ['schema_version', 'name', 'owner', 'email', 'domain', 'summary', 'workflows', 'auth', 'llm_providers']
for key in required:
    if key not in data:
        print(f'Missing required key: {key}')
        sys.exit(1)
if data['schema_version'] != 1:
    print('schema_version must be 1')
    sys.exit(1)
if len(data['workflows']) < 3:
    print('Must have at least 3 workflows')
    sys.exit(1)
print('Portfolio validation passed')
          "